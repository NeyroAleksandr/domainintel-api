services:
  domainintel:
    build: .
    container_name: domainintel
    restart: unless-stopped
    ports:
      - "127.0.0.1:8022:8000"
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      - DEMO_DAILY=${DEMO_DAILY:-5}
      - TRUST_PROXY=1
      - DOMAININTEL_DB=/srv/domainintel/data/domainintel.db
    volumes:
      - ./data:/srv/domainintel/data
